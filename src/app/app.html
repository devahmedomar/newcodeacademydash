@if (auth.isTeacher()) {
  <header class="topbar">
    <div class="brand">New Code Academy</div>
    <nav class="nav">
      <a routerLink="/students" routerLinkActive="active">Students</a>
      <a routerLink="/lessons" routerLinkActive="active">Lessons</a>
    </nav>
    <div class="user">
      <span>{{ auth.user()?.name }}</span>
      <button class="btn btn-secondary btn-sm" (click)="logout()">Log out</button>
    </div>
  </header>
}

<main class="container">
  <router-outlet />
</main>
