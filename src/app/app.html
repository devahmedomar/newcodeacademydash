@if (auth.isTeacher()) {
  <header class="topbar">
    <a routerLink="/students" class="brand">
      <i class="pi pi-graduation-cap"></i>
      <span>New Code Academy</span>
      <span class="brand-badge">Teacher</span>
    </a>
    <nav class="topnav">
      <a routerLink="/students" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
        <i class="pi pi-users"></i><span>Students</span>
      </a>
      <a routerLink="/lessons" routerLinkActive="active">
        <i class="pi pi-book"></i><span>Lessons</span>
      </a>
      <a routerLink="/exams" routerLinkActive="active">
        <i class="pi pi-clipboard"></i><span>Exams</span>
      </a>
    </nav>
    <div class="user-row">
      <span class="user-name">{{ auth.user()?.name }}</span>
      <p-button [text]="true" [rounded]="true" severity="secondary"
                [icon]="theme.isDark() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"
                pTooltip="Toggle dark mode" tooltipPosition="bottom" (onClick)="theme.toggle()" />
      <p-button icon="pi pi-sign-out" severity="secondary" [rounded]="true" [text]="true"
                pTooltip="Log out" tooltipPosition="bottom" (onClick)="logout()" class="logout-btn" />
    </div>
  </header>
}

<main class="page">
  <router-outlet />
</main>
